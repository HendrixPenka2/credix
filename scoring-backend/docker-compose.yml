services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scoring-api
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - PDF_WORKER_URL=http://pdf-worker:8001
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./artefacts:/app/artefacts:ro
      - ./app:/app/app   # ← AJOUTER CETTE LIGNE
    depends_on:
      mongodb:
        condition: service_healthy
      mlflow:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:7.0
    container_name: scoring-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: scoring-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    restart: unless-stopped

  pdf-worker:
    build:
      context: ./pdf-worker
      dockerfile: Dockerfile.pdf
    container_name: scoring-pdf
    ports:
      - "8001:8001"
    restart: unless-stopped

volumes:
  mongo_data:
  mlflow_data:
